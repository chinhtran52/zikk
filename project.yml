name: Zikk
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Release:
      ENABLE_HARDENED_RUNTIME: YES
packages:
  ZikkKit:
    path: Packages/ZikkKit
configFiles:
  Debug: Config/Branding.xcconfig
  Release: Config/Branding.xcconfig
targets:
  Zikk:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: ZikkKit
        product: APICore
      - package: ZikkKit
        product: APIStore
      - package: ZikkKit
        product: DesignSystem
      - package: ZikkKit
        product: Features
    entitlements:
      path: App/Zikk.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME)
        CFBundleName: $(APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppURLScheme: $(APP_URL_SCHEME)
        AppBrandName: $(APP_NAME)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: $(APP_COPYRIGHT)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, vi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: $(APP_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  ZikkUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: Zikk
      - package: ZikkKit
        product: HTTPServer
    entitlements:
      path: UITests/UITests.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Zikk:
    build:
      targets:
        Zikk: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZikkUITests
        - package: ZikkKit/APICoreTests
        - package: ZikkKit/APIStoreTests
        - package: ZikkKit/HTTPServerTests
        - package: ZikkKit/HTTPEngineTests
        - package: ZikkKit/InteropTests
        - package: ZikkKit/CodeGenTests
        - package: ZikkKit/FeaturesTests
        - package: ZikkKit/LayoutTests
        - package: ZikkKit/ScriptEngineTests
        - package: ZikkKit/ExecutionTests
        - package: ZikkKit/RunnerTests
        - package: ZikkKit/SpecKitTests
        - package: ZikkKit/DocsTests
        - package: ZikkKit/MockServerTests
        - package: ZikkKit/RealtimeEngineTests
        - package: ZikkKit/ProtoKitTests
        - package: ZikkKit/GRPCEngineTests
